name: Deploy development

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  images:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        service:
          - api
          - public-portal
          - recruiter-portal
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recruitment-foundry-${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Azure
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      AZURE_ENV_NAME: dev
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Provision infrastructure and Container Apps
        run: |
          set -euo pipefail
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recruitment-foundry"

          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github
          azd env select "$AZURE_ENV_NAME" 2>/dev/null || azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --no-prompt
          azd env set API_IMAGE "${image_prefix}-api:${GITHUB_SHA}"
          azd env set PUBLIC_PORTAL_IMAGE "${image_prefix}-public-portal:${GITHUB_SHA}"
          azd env set RECRUITER_PORTAL_IMAGE "${image_prefix}-recruiter-portal:${GITHUB_SHA}"
          azd provision --no-prompt

      - name: Smoke test endpoints
        run: |
          set -euo pipefail
          api_url="$(azd env get-value API_URL)"
          public_url="$(azd env get-value PUBLIC_PORTAL_URL)"
          recruiter_url="$(azd env get-value RECRUITER_PORTAL_URL)"

          curl --silent --show-error --fail-with-body --retry 10 --retry-all-errors --retry-delay 6 "${api_url}/health"
          echo
          curl --silent --show-error --fail-with-body --retry 60 --retry-all-errors --retry-delay 6 "${api_url}/jobs" --output /dev/null
          curl --silent --show-error --fail-with-body --retry 10 --retry-all-errors --retry-delay 6 "${public_url}/" --output /dev/null
          curl --silent --show-error --fail-with-body --retry 10 --retry-all-errors --retry-delay 6 "${recruiter_url}/" --output /dev/null

          {
            echo "### Deployed ${GITHUB_SHA::7}"
            echo "| App | URL |"
            echo "| --- | --- |"
            echo "| API | ${api_url} |"
            echo "| Public portal | ${public_url} |"
            echo "| Recruiter portal | ${recruiter_url} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show Container Apps diagnostics
        if: failure()
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          resource_group="rg-recruitment-${AZURE_ENV_NAME}"
          az containerapp env show --resource-group "$resource_group" --name "cae-recruitment-${AZURE_ENV_NAME}" \
            --query "{provisioning:properties.provisioningState,errors:properties.deploymentErrors}" --output json || true
          for app in "ca-recruitment-api-${AZURE_ENV_NAME}" "ca-recruitment-public-${AZURE_ENV_NAME}" "ca-recruitment-recruiter-${AZURE_ENV_NAME}"; do
            echo "::group::$app"
            if ! az containerapp show --resource-group "$resource_group" --name "$app" \
              --query "{provisioning:properties.provisioningState,latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,image:properties.template.containers[0].image}" \
              --output json 2>/dev/null; then
              echo "$app does not exist"
              echo "::endgroup::"
              continue
            fi
            az containerapp revision list --resource-group "$resource_group" --name "$app" --all --output table || true
            az containerapp logs show --resource-group "$resource_group" --name "$app" --type system --tail 40 || true
            az containerapp logs show --resource-group "$resource_group" --name "$app" --type console --tail 40 --format text || true
            echo "::endgroup::"
          done
