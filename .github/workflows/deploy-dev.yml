name: Deploy development

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy demo
    runs-on: ubuntu-latest
    environment: dev
    env:
      AZURE_ENV_NAME: dev
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      PUBLIC_PORTAL_APP: ${{ vars.PUBLIC_PORTAL_CONTAINER_APP_NAME || 'ca-recruitment-public-dev' }}
      RECRUITER_PORTAL_APP: ${{ vars.RECRUITER_PORTAL_CONTAINER_APP_NAME || 'ca-recruitment-recruiter-dev' }}
      API_APP: ${{ vars.API_CONTAINER_APP_NAME || 'ca-recruitment-api-dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Run azd provision
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github
          azd env new "$AZURE_ENV_NAME" --no-prompt
          azd env config set infra.parameters.environmentName "$AZURE_ENV_NAME"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd provision --no-prompt

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recruitment-foundry"

          for service in public-portal recruiter-portal api; do
            image="${image_prefix}-${service}:${GITHUB_SHA}"
            docker build --file "src/${service}/Dockerfile" --tag "$image" .
            docker push "$image"
          done

      - name: Deploy applications
        run: |
          resource_group="$(azd env get-value AZURE_RESOURCE_GROUP)"
          cosmos_endpoint="$(azd env get-value AZURE_COSMOS_ENDPOINT)"
          cosmos_database="$(azd env get-value AZURE_COSMOS_DATABASE_NAME)"
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recruitment-foundry"
          api_fqdn="$(az containerapp show \
            --resource-group "$resource_group" \
            --name "$API_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          api_url="https://${api_fqdn}"

          az containerapp update \
            --resource-group "$resource_group" \
            --name "$API_APP" \
            --image "${image_prefix}-api:${GITHUB_SHA}" \
            --set-env-vars \
              PORT=8000 \
              AZURE_COSMOS_ENDPOINT="$cosmos_endpoint" \
              AZURE_COSMOS_DATABASE_NAME="$cosmos_database" \
              AZURE_COSMOS_JOBS_CONTAINER_NAME=jobs \
            --output none

          az containerapp update \
            --resource-group "$resource_group" \
            --name "$PUBLIC_PORTAL_APP" \
            --image "${image_prefix}-public-portal:${GITHUB_SHA}" \
            --set-env-vars PORT=3000 API_BASE_URL="$api_url" \
            --output none

          az containerapp update \
            --resource-group "$resource_group" \
            --name "$RECRUITER_PORTAL_APP" \
            --image "${image_prefix}-recruiter-portal:${GITHUB_SHA}" \
            --set-env-vars PORT=3000 API_BASE_URL="$api_url" \
            --output none

      - name: Verify deployment
        run: |
          resource_group="$(azd env get-value AZURE_RESOURCE_GROUP)"
          api_fqdn="$(az containerapp show --resource-group "$resource_group" --name "$API_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          public_fqdn="$(az containerapp show --resource-group "$resource_group" --name "$PUBLIC_PORTAL_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          recruiter_fqdn="$(az containerapp show --resource-group "$resource_group" --name "$RECRUITER_PORTAL_APP" --query properties.configuration.ingress.fqdn --output tsv)"

          curl --fail-with-body --retry 12 --retry-all-errors --retry-delay 10 "https://${api_fqdn}/health"
          curl --fail-with-body --retry 12 --retry-all-errors --retry-delay 10 "https://${public_fqdn}/"
          curl --fail-with-body --retry 12 --retry-all-errors --retry-delay 10 "https://${recruiter_fqdn}/"
