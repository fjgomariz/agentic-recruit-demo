name: Deploy development

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  images:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        service:
          - api
          - public-portal
          - recruiter-portal
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recruitment-foundry-${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Azure
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      AZURE_ENV_NAME: dev
      ALLOWED_IP_RANGES: ${{ vars.ALLOWED_IP_RANGES }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Provision infrastructure and Container Apps
        run: |
          set -euo pipefail
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recruitment-foundry"

          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github
          azd env select "$AZURE_ENV_NAME" 2>/dev/null || azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --no-prompt
          azd env set API_IMAGE "${image_prefix}-api:${GITHUB_SHA}"
          azd env set PUBLIC_PORTAL_IMAGE "${image_prefix}-public-portal:${GITHUB_SHA}"
          azd env set RECRUITER_PORTAL_IMAGE "${image_prefix}-recruiter-portal:${GITHUB_SHA}"
          # Object ID of the OIDC identity, so Bicep can grant it permission to publish agents.
          principal_id="$(az account get-access-token --query accessToken --output tsv \
            | python3 -c 'import base64, json, sys; p = sys.stdin.read().split(".")[1]; print(json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))["oid"])')"
          azd env set AZURE_PRINCIPAL_ID "$principal_id"
          # The dev Foundry account already exists. Deploy child resources without
          # rewriting the account, which also isolates account-level policy failures.
          azd env set AZURE_FOUNDRY_ACCOUNT_EXISTS true
          # The synthetic knowledge source data is copied from this exact commit by a job inside the virtual network.
          azd env set SEED_SOURCE_BASE_URL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/samples"

          # The portals are reachable only from these public ranges. The ranges stay out of the repository: set the
          # ALLOWED_IP_RANGES variable on the dev environment (comma-separated CIDR), or the rules already on the live portal are kept.
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          allowed_ranges="${ALLOWED_IP_RANGES:-}"
          if [ -z "$allowed_ranges" ]; then
            allowed_ranges="$(az containerapp show --resource-group "rg-recruitment-${AZURE_ENV_NAME}" --name "ca-recruitment-recruiter-${AZURE_ENV_NAME}" \
              --query "properties.configuration.ingress.ipSecurityRestrictions[?action=='Allow' && name!='ci-smoke' && ipAddressRange!='192.0.2.1/32'].ipAddressRange" \
              --output tsv 2>/dev/null | paste -sd, - || true)"
          fi
          if [ -z "$allowed_ranges" ]; then
            echo "::warning::No allowed IP ranges: both portals will refuse all internet traffic. Set the ALLOWED_IP_RANGES variable on the dev environment."
          fi
          azd env set ALLOWED_IP_RANGES "$allowed_ranges"
          azd provision --no-prompt

      - name: Approve the Azure AI Search private link
        run: |
          set -euo pipefail
          bash infra/scripts/approve-search-private-link.sh \
            --storage-account-id "$(az storage account show --resource-group "rg-recruitment-${AZURE_ENV_NAME}" --name "$(azd env get-value AZURE_STORAGE_ACCOUNT_NAME)" --query id --output tsv)" \
            --request-message "$(azd env get-value AZURE_SEARCH_PRIVATE_LINK_MESSAGE)"

      - name: Seed the Foundry IQ knowledge sources
        run: |
          set -euo pipefail
          job="$(azd env get-value AZURE_SEED_JOB_NAME)"
          resource_group="rg-recruitment-${AZURE_ENV_NAME}"
          execution="$(az containerapp job start --resource-group "$resource_group" --name "$job" --query name --output tsv)"
          echo "Started ${job}/${execution}"
          for attempt in $(seq 1 60); do
            status="$(az containerapp job execution show --resource-group "$resource_group" --name "$job" --job-execution-name "$execution" --query properties.status --output tsv)"
            echo "Seed job status: ${status}"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::The seed job ended with status ${status}"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::The seed job did not finish in 15 minutes"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Publish Foundry agents
        run: |
          set -euo pipefail
          python -m pip install --quiet -r agents/requirements.txt
          AZURE_AI_PROJECT_ENDPOINT="$(azd env get-value AZURE_AI_PROJECT_ENDPOINT)" \
          AZURE_AI_MODEL_DEPLOYMENT_NAME="$(azd env get-value AZURE_AI_MODEL_DEPLOYMENT_NAME)" \
          AZURE_SEARCH_ENDPOINT="$(azd env get-value AZURE_SEARCH_ENDPOINT)" \
            python agents/deploy.py

      - name: Create the Foundry IQ knowledge base
        run: |
          set -euo pipefail
          AZURE_SEARCH_ENDPOINT="$(azd env get-value AZURE_SEARCH_ENDPOINT)" \
          AZURE_STORAGE_ACCOUNT_ID="$(azd env get-value AZURE_STORAGE_ACCOUNT_ID)" \
          AZURE_AI_ACCOUNT_NAME="$(azd env get-value AZURE_AI_ACCOUNT_NAME)" \
          AZURE_AI_EMBEDDING_DEPLOYMENT_NAME="$(azd env get-value AZURE_AI_EMBEDDING_DEPLOYMENT_NAME)" \
          AZURE_AI_MODEL_DEPLOYMENT_NAME="$(azd env get-value AZURE_AI_MODEL_DEPLOYMENT_NAME)" \
            python agents/knowledge/setup_knowledge.py

      - name: Smoke test endpoints
        run: |
          set -euo pipefail
          api_url="$(azd env get-value API_URL)"
          public_url="$(azd env get-value PUBLIC_PORTAL_URL)"
          recruiter_url="$(azd env get-value RECRUITER_PORTAL_URL)"
          resource_group="rg-recruitment-${AZURE_ENV_NAME}"

          # This runner is not on the allow list, so both portals must refuse it. Rules can take a moment to apply.
          for portal_url in "$public_url" "$recruiter_url"; do
            status=""
            for attempt in $(seq 1 20); do
              status="$(curl --silent --max-time 15 --output /dev/null --write-out '%{http_code}' "${portal_url}/" || true)"
              [ "$status" = "403" ] && break
              sleep 6
            done
            if [ "$status" != "403" ]; then
              echo "::error::${portal_url} is open to the internet (got HTTP ${status})"
              exit 1
            fi
            echo "${portal_url} refuses clients outside the allow list"
          done

          # Allow this runner temporarily (the cleanup step always removes the rule) and check the full path.
          runner_ip="$(curl --silent --retry 5 https://api.ipify.org)"
          for app in "ca-recruitment-public-${AZURE_ENV_NAME}" "ca-recruitment-recruiter-${AZURE_ENV_NAME}"; do
            az containerapp ingress access-restriction set --resource-group "$resource_group" --name "$app" \
              --rule-name ci-smoke --description "GitHub runner smoke test" --ip-address "${runner_ip}/32" --action Allow --output none
          done
          for portal_url in "$public_url" "$recruiter_url"; do
            # The portal reaches the internal API, which reads Cosmos DB.
            curl --silent --show-error --fail-with-body --retry 30 --retry-all-errors --retry-delay 6 "${portal_url}/api/health"
            echo
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${portal_url}/")"
            if [ "$status" != "200" ]; then
              echo "::error::${portal_url}/ answered HTTP ${status}"
              exit 1
            fi
          done

          # The API has internal ingress only: from the internet the environment answers 404 (or the name does not resolve).
          api_status="$(curl --silent --max-time 15 --output /dev/null --write-out '%{http_code}' "${api_url}/health" || true)"
          if [ "$api_status" = "200" ]; then
            echo "::error::The API answered from the internet: ${api_url}"
            exit 1
          fi
          echo "API is not reachable from the internet (HTTP ${api_status})"

          {
            echo "### Deployed ${GITHUB_SHA::7}"
            echo "| App | URL |"
            echo "| --- | --- |"
            echo "| Public portal (IP allow list) | ${public_url} |"
            echo "| Recruiter portal (IP allow list) | ${recruiter_url} |"
            echo "| API (internal only) | ${api_url} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary runner access rule
        if: always()
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors || true
          for app in "ca-recruitment-public-${AZURE_ENV_NAME}" "ca-recruitment-recruiter-${AZURE_ENV_NAME}"; do
            az containerapp ingress access-restriction remove --resource-group "rg-recruitment-${AZURE_ENV_NAME}" --name "$app" \
              --rule-name ci-smoke --output none 2>/dev/null || true
          done

      - name: Show Container Apps diagnostics
        if: failure()
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          resource_group="rg-recruitment-${AZURE_ENV_NAME}"
          az containerapp env show --resource-group "$resource_group" --name "cae-recruitment-${AZURE_ENV_NAME}" \
            --query "{provisioning:properties.provisioningState,errors:properties.deploymentErrors}" --output json || true
          for app in "ca-recruitment-api-${AZURE_ENV_NAME}" "ca-recruitment-public-${AZURE_ENV_NAME}" "ca-recruitment-recruiter-${AZURE_ENV_NAME}"; do
            echo "::group::$app"
            if ! az containerapp show --resource-group "$resource_group" --name "$app" \
              --query "{provisioning:properties.provisioningState,latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,image:properties.template.containers[0].image}" \
              --output json 2>/dev/null; then
              echo "$app does not exist"
              echo "::endgroup::"
              continue
            fi
            az containerapp revision list --resource-group "$resource_group" --name "$app" --all --output table || true
            az containerapp logs show --resource-group "$resource_group" --name "$app" --type system --tail 40 || true
            az containerapp logs show --resource-group "$resource_group" --name "$app" --type console --tail 40 --format text || true
            echo "::endgroup::"
          done
