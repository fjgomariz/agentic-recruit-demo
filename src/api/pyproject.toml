[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recruitment-foundry-api"
version = "0.1.0"
description = "FastAPI backend for the Recruitment Foundry Demo"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.11,<4.0",
  "azure-cosmos>=4.9,<5.0",
  "azure-identity>=1.24,<2.0",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]